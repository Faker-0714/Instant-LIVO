common:
  bag_enable: false # true: read bag directly; false: subscribe to ROS topics
  bag_path: "" # bag file path used when bag_enable is true
  img_topic: "/alphasense/cam0/image_raw"
  lid_topic: "/hesai/pandar"
  imu_topic: "/alphasense/imu"
  img_en: 1
  lidar_en: 1
  ros_driver_bug_fix: false

extrin_calib:
  # HILTI2023 handheld: LiDAR -> IMU, rotation stored row-major.
  extrinsic_T: [-0.00695046499029016, -0.006713481609220226, 0.04989346097032105]
  extrinsic_R: [0.00660963984846936, -0.999976224957192, 0.001965243352927243,
                -0.999977365029464, -0.006612093869054185, -0.001244846735961017,
                0.001257811513201671, -0.001956970881110609, -0.9999972940839225]

  # LiDAR -> camera: inverse(T_imu_camera) * T_imu_lidar.
  Rcl: [-0.9998989151344442, -0.01144242991547552, 0.008439805127641994,
        -0.008399309444601388, -0.003582530220254537, -0.9999583076699131,
        0.01147218871083335, -0.9999281155537392, 0.003486059571010633]
  Pcl: [-0.05410116394941460, 0.06382903805220455, -0.05445023315271488]

time_offset:
  imu_time_offset: 0.0
  lidar_time_offset: 0.0015846550361175184
  img_time_offset: 0.001985775109730793
  exposure_time_init: 0.0

preprocess:
  hilti_en: true
  point_filter_num: 1
  filter_size_surf: 0.1 # 0.2
  lidar_type: 5 # HesaiXT32
  scan_line: 32
  blind: 0.6 # 0.1 0.3
 
vio:
  # One fixed photometric anchor; only the current filter state is updated.
  reference_max_age: 8
  visual_voxel_size: 0.5 # independent visual-feature grid, meters
  max_iterations: 5
  outlier_threshold: 500
  img_point_cov: 1000
  patch_size: 8
  patch_pyrimid_level: 4
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.1

imu:
  imu_en: true
  imu_int_frame: 30
  acc_cov: 0.5 # 0.1
  gyr_cov: 0.01
  b_acc_cov: 0.0001 # 0.1
  b_gyr_cov: 0.0001 # 0.1

lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.05
  variance_floor: 0.001 # measurement variance floor, m^2
  min_eigen_value: 0.0001 # normalized plane scatter, m^2

map:
  resolution: 0.4 # block edge in metres; subvoxel edge is half this
  capacity: 100000000 # most recently inserted/touched blocks retained


uav:
  imu_rate_odom: false
  gravity_align_en: false

publish:
  dense_map_en: true
  pub_effect_point_en: false 
  pub_plane_en: false
  pub_scan_num: 1
  blind_rgb_points: 0.0

evo:
  seq_name: "hilti23_handheld"
  pose_output_en: true

pcd_save:
  pcd_save_en: true
  type: 0 # 0: World Frame, 1: Body Frame;
  colmap_output_en: false # need to set interval = -1
  filter_size_pcd: 0.15
  interval: -1
  # how many LiDAR frames saved in each pcd file;
  # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.

image_save:
  img_save_en: false
  interval: 1
